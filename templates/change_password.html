{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Change Password</h1>
    <p class="sub">Use a strong password that you don't use anywhere else.</p>
  </div>
</div>
<form method="post" class="card" style="max-width:440px">
  <div class="field"><label for="old">Old password</label>
    <div class="input-icon">{{ icon('lock') }}<input id="old" name="old" type="password" autocomplete="current-password" required></div></div>
  <div class="field"><label for="new">New password <small>min 6 characters</small></label>
    <div class="input-icon">{{ icon('key') }}<input id="new" name="new" type="password" autocomplete="new-password" required minlength="6"></div></div>
  <button class="btn primary">Change password</button>
</form>
{% endblock %}
